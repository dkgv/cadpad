<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="color-scheme" content="light dark"/><title>Cadpad</title><style>.cadpad-startup{font:14px -apple-system,BlinkMacSystemFont,sans-serif;color:#24262b;background:#f7f8fa;min-height:100vh;box-sizing:border-box;display:grid;place-items:center}.cadpad-startup[role=status]{background:#1c1e22;color:#e8eaed}.cadpad-loading{display:flex;align-items:center;gap:11px;color:#9aa3b2;font-size:13px;letter-spacing:.01em}.cadpad-loading-mark{width:16px;height:16px;border:2px solid #3a3f47;border-top-color:#9aa3b2;border-radius:50%;animation:cadpad-spin .8s linear infinite}@keyframes cadpad-spin{to{transform:rotate(360deg)}}.cadpad-startup h1{font-size:24px}.cadpad-startup p{max-width:560px;line-height:1.6}.cadpad-startup button{font:inherit;border:1px solid #dce0e6;border-radius:8px;padding:9px 14px;background:white;color:#24262b;cursor:pointer}.cadpad-startup details{margin-top:24px}.cadpad-startup pre{white-space:pre-wrap;overflow-wrap:anywhere;max-width:800px}@media(prefers-reduced-motion:reduce){.cadpad-loading-mark{animation:none}}@media(prefers-color-scheme:dark){.cadpad-startup{color:#e8eaed;background:#1c1e22}.cadpad-startup button{background:#2a2d33;border-color:#454b55;color:#e8eaed}}</style><script src="/startup.js"></script></head><body><div id="root"><main class="cadpad-startup" role="status"><div class="cadpad-loading"><span class="cadpad-loading-mark" aria-hidden="true"></span><span>Cadpad</span></div></main></div><script type="module" src="/src/main.tsx"></script></body></html>
