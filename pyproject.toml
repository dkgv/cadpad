[project]
name = "cadpad-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["cadquery==2.6.1", "ocp-tessellate==3.0.17"]

[dependency-groups]
dev = ["pytest==8.4.2", "pyinstaller==6.16.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/cadpad_worker"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["python/tests"]
