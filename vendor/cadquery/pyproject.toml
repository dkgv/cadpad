[build-system]
requires = ["hatchling"]
build-backend = "backend"
backend-path = ["."]

[project]
name = "cadquery"
version = "2.6.1+cadpad.1"
description = "CadQuery 2.6.1 with lazy VTK imports for Cadpad's headless runtime"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "cadquery-ocp-novtk==7.8.1.1.post1",
  "ezdxf>=1.3.0", "multimethod>=1.11,<2.0", "nlopt>=2.9.0,<3.0",
  "typish", "casadi", "path",
]

[tool.hatch.build.targets.wheel]
packages = ["cadquery"]

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "backend.py", "no-vtk.patch", "UPSTREAM.json", "LICENSE", "README.md"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "backend.py" }, { file = "no-vtk.patch" }, { file = "UPSTREAM.json" }]
