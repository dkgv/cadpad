name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'apps/desktop/src-tauri/**'
      - 'python/**'
      - 'fixtures/**'
      - 'docs/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'apps/desktop/src-tauri/**'
      - 'python/**'
      - 'fixtures/**'
      - 'docs/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p cadpad-core -p cadpad-agent -p cadpad-mcp

  python:
    name: Python tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: .venv/bin/python -m pytest -q
