name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'apps/desktop/src-tauri/**'
      - 'python/**'
      - 'fixtures/**'
      - 'docs/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tests.yml'
      - '.config/nextest.toml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'apps/desktop/src-tauri/**'
      - 'python/**'
      - 'fixtures/**'
      - 'docs/**'
      - 'scripts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/tests.yml'
      - '.config/nextest.toml'

permissions:
  contents: read

jobs:
  rust:
    name: Rust tests
    runs-on: macos-15
    env:
      # Keep line numbers in backtraces without generating full debug symbols.
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.151
      - uses: Swatinem/rust-cache@v2
        with:
          # A late test failure should not discard the dependency build.
          cache-on-failure: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Workers read bytecode but deliberately never write it. Compile once here
      # so every fresh interpreter does not reparse the installed dependencies.
      - run: uv sync --locked --python 3.12 --compile-bytecode
      # Two test slots across binaries; heavy suites reserve both (nextest.toml).
      - run: cargo nextest run --locked --profile ci -p cadpad-core -p cadpad-agent -p cadpad-mcp
      # Nextest does not run doctests. Keep Cargo's example compilation checks too.
      - run: |
          cargo test --locked -p cadpad-core -p cadpad-agent -p cadpad-mcp --doc
          cargo test --locked -p cadpad-core -p cadpad-agent -p cadpad-mcp --examples --no-run

  python:
    name: Python tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --python 3.12
      - run: .venv/bin/python -m pytest -q
